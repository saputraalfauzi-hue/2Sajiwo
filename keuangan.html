<!DOCTYPE html>
<html lang="id">
<head>
    <title>Manajemen Keuangan</title>
    <link rel="stylesheet" href="tampilan.css"> 
</head>
<body>

<div class="container">
    <h2>Manajemen Keuangan</h2>

    <p>Sisa Saldo: <span id="saldo" class="income">Rp 0</span></p>

    <h3>Input Transaksi</h3>
    <label for="jumlah">Jumlah (Rp):</label>
    <input type="number" id="jumlah" placeholder="Masukkan jumlah" required>

    <label for="tipe">Jenis Transaksi:</label>
    <select id="tipe">
        <option value="pemasukan">Pemasukan (+)</option>
        <option value="pengeluaran">Pengeluaran (-)</option>
    </select>

    <button onclick="tambahTransaksi()">Tambah Transaksi</button>

    <h3>Riwayat Transaksi</h3>
    <ul id="riwayat">
        </ul>
    
    <button onclick="hapusSemuaData()" style="background-color: #f44336;">Hapus Semua Data</button>
</div>

<script src="sistem.js"></script>

</body>
</html>
